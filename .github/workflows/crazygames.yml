# Builds the CrazyGames version of the game and attaches the upload-ready zip
# to the workflow run (Actions tab -> run -> Artifacts -> skyward-crazygames).
name: CrazyGames package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:crazygames
        env:
          # Optional multiplayer server baked into the build (same variable as the Pages build)
          VITE_MP_SERVER: ${{ vars.MP_SERVER_URL }}
      # The artifact is the contents of dist-crazygames/ (download gives a zip
      # with index.html at its root, ready to upload)
      - uses: actions/upload-artifact@v4
        with:
          name: skyward-crazygames
          path: dist-crazygames/
          if-no-files-found: error
