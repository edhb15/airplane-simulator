# Render Blueprint for the Skyward multiplayer server (free web service).
# Deploy: https://render.com/deploy?repo=https://github.com/edhb15/airplane-simulator
# The game itself is hosted on GitHub Pages; this service only relays players.
services:
  - type: web
    name: skyward-multiplayer
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # The game is played on GitHub Pages and on CrazyGames (which serves it from
      # its own domains, sometimes inside a sandboxed frame), so any page may
      # connect. Per-address, per-room and total connection limits still apply.
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: TRUST_PROXY
        value: "1"
