# Render Blueprint for the Skyward multiplayer server (free web service).
# Deploy: https://render.com/deploy?repo=https://github.com/edhb15/airplane-simulator
# The game itself is hosted on GitHub Pages; this service only relays players.
services:
  - type: web
    name: skyward-multiplayer
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Only these pages may connect (the GitHub Pages site and local development)
      - key: ALLOWED_ORIGINS
        value: https://edhb15.github.io,http://localhost:5173
      - key: TRUST_PROXY
        value: "1"
